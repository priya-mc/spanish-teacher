openapi: 3.0.0
info:
  title: Speech Processing API
  version: 1.0.0
  description: API for speech-to-text and text-to-speech services using Deepgram
paths:
  /api/v1/stt/stream:
    post:
      summary: Stream speech to text
      tags: [Speech]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        200:
          description: Successful transcription stream
        400:
          description: Invalid request
        429:
          description: Rate limit exceeded
  /api/v1/tts/stream:
    post:
      summary: Stream text to speech
      tags: [Speech]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                voice:
                  type: string
      responses:
        200:
          description: Audio stream
        400:
          description: Invalid request 